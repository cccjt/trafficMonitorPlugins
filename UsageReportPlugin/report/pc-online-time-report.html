<body>
<div class="page">

<header class="masthead">
  <div class="eyebrow">电源 + 锁屏事件审计 · CCC-HOME</div>
  <h1>电脑使用时长分析</h1>
</header>

<div class="kpi-grid">
  <div class="kpi">
    <div class="num"><span data-kpi="avg">13.1</span><em>h</em></div>
    <span class="label">日均使用</span>
  </div>
  <div class="kpi">
    <div class="num"><span data-kpi="median">15.7</span><em>h</em></div>
    <span class="label">中位数</span>
  </div>
  <div class="kpi">
    <div class="num"><span data-kpi="total">1906</span><em>h</em></div>
    <span class="label">累计使用</span>
  </div>
  <div class="kpi warn">
    <div class="num"><span data-kpi="longest">56.6</span><em>h</em></div>
    <span class="label">最长连续使用</span>
  </div>
  <div class="kpi">
    <div class="num"><span data-kpi="locks">132</span></div>
    <span class="label">开机期间锁屏次数</span>
  </div>
</div>

<section>
  <h2><span class="idx">01</span>逐日使用时长</h2>
  <figure class="chart-figure">
    <figcaption>图 1　每日使用与未使用时长（小时）</figcaption>
    <div class="legend">
      <span><i class="c-use"></i>使用中</span>
      <span><i class="c-lock"></i>开机但锁屏</span>
      <span><i class="c-off"></i>开机但息屏</span>
    </div>
    <div id="chart-daily" class="chart-container" style="min-height:300px"></div>
  </figure>
  <figure class="chart-figure">
    <figcaption>图 2　每天开机 / 关机时刻</figcaption>
    <div class="legend">
      <span><i class="c-start"></i>开机</span>
      <span><i class="c-end"></i>关机</span>
    </div>
    <div id="chart-times" class="chart-container" style="min-height:240px"></div>
  </figure>
</section>

<section>
  <h2><span class="idx">02</span>每日日历</h2>
  <div class="cal-toolbar">
    <button type="button" class="cal-nav" id="cal-prev" aria-label="上一个月">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button type="button" class="cal-nav" id="cal-next" aria-label="下一个月">›</button>
  </div>
  <div id="calendar"></div>
</section>

</div>

<div class="cal-modal" id="cal-modal" aria-hidden="true">
  <div class="cal-modal-backdrop" data-close="1"></div>
  <div class="cal-modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-date">
    <div class="cal-modal-head">
      <div>
        <div class="cal-modal-date" id="modal-date"></div>
      </div>
      <button type="button" class="cal-close" id="modal-close" aria-label="关闭">×</button>
    </div>
    <div class="cal-timeline" id="modal-timeline"></div>
  </div>
</div>

<script src="./_shared/js/echarts.min.js"></script>
<script>
  // 数据与图表脚本每次生成都会变，加时间戳避免浏览器命中旧缓存
  var _t = Date.now();
  document.write('<script src="assets/data.js?t=' + _t + '"><\/script>');
  document.write('<script src="assets/charts.js?t=' + _t + '"><\/script>');
</script>
