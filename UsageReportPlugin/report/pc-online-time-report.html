<script>
(function () {
  'use strict';
  var bridge = (window.chrome && window.chrome.webview) ? window.chrome.webview : null;

  function el(id) { return document.getElementById(id); }

  function b64decode(value) {
    if (!value) return '';
    try {
      var binary = atob(value);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    } catch (e) {
      return '';
    }
  }

  function b64encode(text) {
    if (!text) return '';
    var bytes = new TextEncoder().encode(text);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  function parseConfig(text) {
    var config = { enabled: false, method: 'POST', interval: 5, url: '', headers: '', body: '' };
    if (!text) return config;

    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/\r/g, '');
      var separator = line.indexOf('=');
      if (separator < 0) continue;

      var key = line.slice(0, separator).toLowerCase();
      var value = line.slice(separator + 1);
      if (key === 'enabled') {
        config.enabled = value === '1' || value.toLowerCase() === 'true';
      } else if (key === 'method') {
        config.method = value.toUpperCase();
      } else if (key === 'interval') {
        var interval = parseInt(value, 10);
        config.interval = isNaN(interval) ? 5 : Math.max(1, Math.min(1440, interval));
      } else if (key === 'url') {
        config.url = value;
      } else if (key === 'headers') {
        config.headers = b64decode(value);
      } else if (key === 'body') {
        config.body = b64decode(value);
      }
    }
    return config;
  }

  var config = parseConfig(b64decode(window.__heartbeatConfigB64 || ''));

  function fillForm() {
    el('hb-enabled').checked = config.enabled;
    el('hb-method').value = config.method;
    el('hb-url').value = config.url;
    el('hb-interval').value = config.interval;
    el('hb-headers').value = config.headers;
    el('hb-body').value = config.body;
  }

  function openModal() {
    fillForm();
    el('hb-error').textContent = bridge ? '' : '当前不在插件弹窗中，设置无法保存';
    el('hb-status').textContent = '';
    el('hb-modal').classList.add('open');
    el('hb-modal').setAttribute('aria-hidden', 'false');
  }

  function closeModal() {
    el('hb-modal').classList.remove('open');
    el('hb-modal').setAttribute('aria-hidden', 'true');
  }

  function save() {
    var enabled = el('hb-enabled').checked;
    var method = el('hb-method').value;
    var url = el('hb-url').value.trim();
    var interval = parseInt(el('hb-interval').value, 10);
    var headers = el('hb-headers').value;
    var body = el('hb-body').value;

    if (enabled && !url) { el('hb-error').textContent = '请填写请求地址'; return; }
    if (enabled && !/^https?:\/\//i.test(url)) {
      el('hb-error').textContent = '请求地址必须以 http:// 或 https:// 开头';
      return;
    }
    if (isNaN(interval) || interval < 1) { el('hb-error').textContent = '间隔时间至少为 1 分钟'; return; }
    if (!bridge) { el('hb-error').textContent = '当前不在插件弹窗中，设置无法保存'; return; }

    var text = 'enabled=' + (enabled ? '1' : '0')
      + '\nmethod=' + method
      + '\ninterval=' + interval
      + '\nurl=' + url
      + '\nheaders=' + b64encode(headers)
      + '\nbody=' + b64encode(body);

    bridge.postMessage(text);
    config = { enabled: enabled, method: method, interval: interval, url: url, headers: headers, body: body };
    el('hb-error').textContent = '';
    el('hb-status').textContent = enabled
      ? ('已保存，后台每 ' + interval + ' 分钟发送一次')
      : '已保存，心跳已关闭';
  }

  el('hb-open').addEventListener('click', openModal);
  el('hb-close').addEventListener('click', closeModal);
  el('hb-save').addEventListener('click', save);
  el('hb-modal').addEventListener('click', function (event) {
    if (event.target && event.target.getAttribute('data-hb-close') === '1') closeModal();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && el('hb-modal').classList.contains('open')) closeModal();
  });

  fillForm();
})();
</script>

  document.write('<script src="assets/data.js?t=' + _t + '"><\/script>');
  document.write('<script src="assets/charts.js?t=' + _t + '"><\/script>');
</script>
