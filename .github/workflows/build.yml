name: Build Plugins

on:
  push:
    branches: [ main, master ]
    paths:
      - 'HotkeyPlugin.sln'
      - 'LeftClickMenu/**'
      - 'ScreenshotPlugin/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Setup Visual Studio
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Show environment
      shell: cmd
      run: |
        echo === VSINSTALLDIR ===
        echo "%VSINSTALLDIR%"
        echo === VCToolsInstallDir ===
        echo "%VCToolsInstallDir%"

    - name: Build Release x64
      shell: cmd
      run: |
        set BUILD_FAILED=0
        msbuild LeftClickMenu\LeftClickMenu.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /m /verbosity:minimal > build.log 2>&1
        if errorlevel 1 set BUILD_FAILED=1
        msbuild ScreenshotPlugin\ScreenshotPlugin.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /m /verbosity:minimal >> build.log 2>&1
        if errorlevel 1 set BUILD_FAILED=1
        type build.log
        findstr /R /C:": error " build.log || rem
        if %BUILD_FAILED%==1 exit /b 1

    - name: Report build errors as annotations
      if: failure()
      shell: pwsh
      run: |
        if (Test-Path build.log) {
          Get-Content build.log |
            Where-Object { $_ -match 'error' -and $_ -notmatch 'warning' } |
            Select-Object -First 40 |
            ForEach-Object {
              $msg = $_ -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error::$msg"
            }
        }

    - name: Upload build log on failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-log
        path: build.log
        if-no-files-found: warn

    - name: List build output
      if: success()
      shell: powershell
      run: |
        Get-ChildItem -Path . -Recurse -Filter "*.dll" | Format-List FullName, Length

    - name: Upload LeftClickMenu artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: LeftClickMenu-x64
        path: |
          x64\Release\LeftClickMenu.dll
        if-no-files-found: warn

    - name: Upload ScreenshotPlugin artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: ScreenshotPlugin-x64
        path: |
          x64\Release\ScreenshotPlugin.dll
        if-no-files-found: warn

    - name: Publish LeftClickMenu to latest release
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = "latest-build"
        gh release view $tag *> $null
        if ($LASTEXITCODE -ne 0) {
          gh release create $tag --title "Latest build" --notes "自动构建产物，每次推送 master 时更新。" --prerelease
        }
        gh release upload $tag "x64/Release/LeftClickMenu.dll" --clobber
